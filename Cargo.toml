[package]
name = "procband"
version = "0.1.0"
edition = "2024"


description = "A lightweight Procfile-based development process orchestrator with a terminal UI"
license = "MIT"
repository = "https://github.com/Dark74A/procband"
readme = "README.md"
keywords = ["cli", "tui", "process", "development", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.29"
tokio = { version = "1", features = ["full"] }
futures = "0.3.34"
libc = "0.2.189"
